<!DOCTYPE html>
<html>
<head>

<title>Blackjack</title>

<link rel="stylesheet" href="/static/style.css">

</head>

<body>

<h1>BLACKJACK</h1>

<h2>Kartu Dealer</h2>

<p>
{% for k in dealer %}
{{k}}
{% endfor %}
</p>


<h2>Kartu Kamu</h2>

<p>
{% for k in player %}
{{k[0]}}{{k[1]}}
{% endfor %}
</p>

<p>Total: {{total}}</p>


<a href="/hit">
<button>Hit</button>
</a>

<a href="/">
<button>Restart</button>
</a>

</body>
</html>
