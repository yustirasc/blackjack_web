<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ganti Password</title>
    
        <!-- FAVICON -->
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="shortcut icon" href="/static/favicon.ico">
    
    <!-- CSS -->
    <link rel="stylesheet" href="/static/style.css">
    
    <style>
        .password-container {
            max-width: 400px;
            margin: 50px auto;
            padding: 30px;
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }
        
        h1 {
            color: #f1c40f;
            text-align: center;
            margin-bottom: 30px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #f1c40f;
            font-weight: bold;
        }
        
        input {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: rgba(255,255,255,0.9);
            font-size: 16px;
        }
        
        .btn-change {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #27ae60, #2ecc71);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }
        
        .btn-change:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(46,204,113,0.4);
        }
        
        .info-text {
            text-align: center;
            margin-top: 20px;
            opacity: 0.8;
            font-size: 14px;
        }
        
        .error-message {
            background: rgba(231, 76, 60, 0.2);
            color: #e74c3c;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 20px;
            border: 1px solid #e74c3c;
        }
        
        .success-message {
            background: rgba(46, 204, 113, 0.2);
            color: #2ecc71;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 20px;
            border: 1px solid #2ecc71;
        }
        
        .menu-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 30px;
        }
        
        .btn-back {
            background: #3498db;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="password-container">
        <h1>🔐 GANTI PASSWORD</h1>
        
        <!-- Notifikasi dari URL -->
        {% if request.args.get('error') %}
        <div class="error-message">
            ⚠️ {{ request.args.get('error') }}
        </div>
        {% endif %}
        
        {% if request.args.get('success') %}
        <div class="success-message">
            ✅ Password berhasil diubah!
        </div>
        {% endif %}
        
        <form method="post">
            <div class="form-group">
                <label> Password Lama</label>
                <input type="password" name="old_password" placeholder="Masukkan password lama" required>
            </div>
            
            <div class="form-group">
                <label> Password Baru</label>
                <input type="password" name="new_password" placeholder="Minimal 4 karakter" required minlength="4">
            </div>
            
            <div class="form-group">
                <label> Konfirmasi Password Baru</label>
                <input type="password" name="confirm_password" placeholder="Ketik ulang password baru" required minlength="4">
            </div>
            
            <button type="submit" class="btn-change"> Ganti Password</button>
        </form>
        
        <div class="info-text">
            <i class="fas fa-info-circle"></i> Gunakan password yang kuat dan jangan sampai lupa!
        </div>
        
        <div class="menu-buttons">
            <a href="/profile" class="btn-back">⬅️ Kembali ke Profil</a>
            <a href="/game" class="btn-back" style="background-color: #27ae60;">🎮 Game</a>
        </div>
    </div>
</body>
</html>
